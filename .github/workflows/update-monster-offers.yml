name: Update Monster offers

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-monster-offers.yml'
      - 'Neuer Ordner/update-offers.mjs'

permissions:
  contents: write

jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current prospect data
        run: node 'Neuer Ordner/update-offers.mjs'
      - name: Publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Neuer Ordner/latest-offers.js'
          if git diff --cached --quiet; then
            echo 'Offer data has not changed.'
          else
            git commit -m 'Update weekly Monster offers'
            git push
          fi